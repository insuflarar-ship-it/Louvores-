<!doctype html><html lang='pt-BR'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#263b67'><link rel='manifest' href='manifest.json'><title>Louvores</title><style>
:root{--b:#263b67;--l:#eef2f8;--w:#fff;--t:#172033}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--l);color:var(--t)}header{background:var(--b);color:#fff;padding:18px 16px;text-align:center;position:sticky;top:0;z-index:2}header h1{margin:0;font-size:22px}.wrap{max-width:760px;margin:auto;padding:14px}.search{display:flex;gap:8px}.search input,.form input,.form textarea{width:100%;border:1px solid #ccd3df;border-radius:12px;padding:13px;font-size:16px}.search button,.btn{border:0;border-radius:12px;padding:12px 15px;background:var(--b);color:white;font-weight:700}.az{display:flex;gap:7px;overflow:auto;padding:14px 0}.az button{min-width:38px;height:38px;border:0;border-radius:9px;background:#fff;box-shadow:0 1px 4px #ccd}.card{background:#fff;margin:9px 0;padding:15px;border-radius:14px;box-shadow:0 2px 8px #d9deea;display:flex;justify-content:space-between;align-items:center}.card strong{font-size:17px}.small{font-size:13px;color:#657}.fab{position:fixed;right:20px;bottom:22px;width:58px;height:58px;border-radius:50%;border:0;background:var(--b);color:#fff;font-size:30px}.modal,.song{display:none;position:fixed;inset:0;background:#fff;z-index:10;overflow:auto}.modal.on,.song.on{display:block}.bar{position:sticky;top:0;background:var(--b);color:#fff;padding:10px;display:flex;gap:8px;align-items:center;z-index:2}.bar button{background:#fff;border:0;border-radius:9px;padding:9px}.songText{white-space:pre-wrap;padding:24px 20px 100px;max-width:850px;margin:auto;font-size:24px;line-height:1.55}.songTitle{text-align:center;padding:20px 10px 0}.form{padding:18px;max-width:700px;margin:auto}.form>*{margin-bottom:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(min-width:700px){.songText{font-size:28px}}
</style><link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#274477"><link rel="apple-touch-icon" href="./icon-192.png"></head><body>
<header><h1>🎵 Louvores</h1><div class='small' style='color:#dfe7ff'>Índice e letras offline</div></header><main class='wrap'><div class='search'><input id='q' placeholder='Buscar por número ou título'><button onclick='render()'>Buscar</button></div><div class='az' id='az'></div><div id='list'></div><div class='actions' style='margin-top:14px'><button class='btn' onclick='backupSongs()'>💾 Fazer backup</button><button class='btn' onclick="document.getElementById('restoreFile').click()">📂 Restaurar backup</button><input id='restoreFile' type='file' accept='.json,application/json' style='display:none' onchange='restoreSongs(event)'></div></main><button class='fab' onclick='editSong()'>+</button>
<section class='modal' id='editor'><div class='bar'><button onclick='closeEditor()'>← Voltar</button><b id='editTitle'>Adicionar louvor</b></div><div class='form'><input id='num' placeholder='Número do louvor'><input id='title' placeholder='Título'><textarea id='lyrics' rows='18' placeholder='Cole aqui a letra do louvor'></textarea><div class='actions'><button class='btn' onclick='saveSong()'>Salvar</button><button class='btn' id='deleteBtn' style='display:none' onclick='deleteSong()'>Excluir</button></div></div></section>
<section class='song' id='viewer'><div class='bar' id='viewerBar'><button onclick='closeSong()'>← Índice</button><button onclick='font(-2)'>A−</button><button onclick='font(2)'>A+</button><button onclick='projection()'>⛶ Projeção</button><button onclick='editCurrent()'>Editar</button></div><h2 class='songTitle' id='vtitle'></h2><div class='songText' id='vlyrics'></div></section>
<script>
let songs=JSON.parse(localStorage.getItem('louvores')||'[]'),current=null,editing=null,letter='';const $=id=>document.getElementById(id);
function persist(){localStorage.setItem('louvores',JSON.stringify(songs))}
function init(){let a='TODASABCDEFGHIJKLMNOPQRSTUVWXYZ'.match(/TODAS|./g);$('az').innerHTML=a.map(x=>`<button onclick="letter='${x==='TODAS'?'':x}';render()">${x}</button>`).join('');render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}
function render(){let q=$('q').value.toLowerCase().trim();let r=songs.filter(s=>(!letter||s.title.toUpperCase().startsWith(letter))&&(!q||String(s.num).includes(q)||s.title.toLowerCase().includes(q))).sort((a,b)=>(+a.num||99999)-(+b.num||99999)||a.title.localeCompare(b.title));$('list').innerHTML=r.length?r.map(s=>`<div class='card' onclick="openSong('${s.id}')"><div><strong>${s.num?s.num+' - ':''}${esc(s.title)}</strong><div class='small'>Toque para abrir em tela cheia</div></div><span>›</span></div>`).join(''):`<div class='card'>Nenhum louvor cadastrado. Toque em + para adicionar.</div>`}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nextSongNumber(){let nums=songs.map(s=>parseInt(s.num,10)).filter(Number.isFinite);return nums.length?Math.max(...nums)+1:1}
function editSong(id=null){editing=id;let s=songs.find(x=>x.id===id);$('num').value=s?.num||String(nextSongNumber()).padStart(2,'0');$('title').value=s?.title||'';$('lyrics').value=s?.lyrics||'';$('deleteBtn').style.display=s?'block':'none';$('editTitle').textContent=s?'Editar louvor':'Adicionar louvor';$('editor').classList.add('on')}
function closeEditor(){$('editor').classList.remove('on')}
function registerChange(){let n=parseInt(localStorage.getItem('alteracoesDesdeBackup')||'0',10)+1;localStorage.setItem('alteracoesDesdeBackup',String(n));if(n>=5)setTimeout(()=>alert('💾 Você já fez '+n+' alterações desde o último backup. Recomendamos fazer um novo backup dos louvores.'),150)}
function saveSong(){let title=$('title').value.trim(),lyrics=$('lyrics').value.trim();if(!title||!lyrics)return alert('Preencha o título e a letra.');let data={id:editing||String(Date.now()),num:$('num').value.trim(),title,lyrics};if(editing)songs=songs.map(s=>s.id===editing?data:s);else songs.push(data);persist();registerChange();closeEditor();render();if(current===editing)openSong(editing)}
function deleteSong(){if(confirm('Excluir este louvor?')){songs=songs.filter(s=>s.id!==editing);persist();registerChange();closeEditor();closeSong();render()}}
function openSong(id){let s=songs.find(x=>x.id===id);if(!s)return;current=id;$('vtitle').textContent=(s.num?s.num+' - ':'')+s.title;$('vlyrics').textContent=s.lyrics;$('viewer').classList.add('on');window.scrollTo(0,0)}
function closeSong(){$('viewer').classList.remove('on');document.documentElement.requestFullscreen&&document.fullscreenElement&&document.exitFullscreen().catch(()=>{})}
function font(n){let e=$('vlyrics'),v=parseInt(getComputedStyle(e).fontSize);e.style.fontSize=Math.max(16,Math.min(48,v+n))+'px'}
function projection(){let b=$('viewerBar'),h=$('vtitle');let hide=b.style.display!=='none';b.style.display=hide?'none':'flex';h.style.display=hide?'none':'block';if(hide&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});else if(!hide&&document.fullscreenElement)document.exitFullscreen().catch(()=>{})}
function backupSongs(){if(!songs.length)return alert('Ainda não há louvores cadastrados para fazer backup.');let data={app:'Louvores',version:2,createdAt:new Date().toISOString(),songs:songs};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a'),d=new Date(),pad=n=>String(n).padStart(2,'0');a.href=url;a.download='backup-louvores-'+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'.json';document.body.appendChild(a);a.click();a.remove();localStorage.setItem('alteracoesDesdeBackup','0');setTimeout(()=>URL.revokeObjectURL(url),1000)}
function restoreSongs(ev){let file=ev.target.files&&ev.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=function(){try{let data=JSON.parse(reader.result),incoming=Array.isArray(data)?data:data.songs;if(!Array.isArray(incoming))throw new Error('Formato inválido');incoming=incoming.filter(s=>s&&typeof s.title==='string'&&typeof s.lyrics==='string').map((s,i)=>({id:String(s.id||Date.now()+'-'+i),num:String(s.num||''),title:s.title,lyrics:s.lyrics}));if(!incoming.length)throw new Error('Nenhum louvor encontrado');if(!confirm('Restaurar '+incoming.length+' louvor(es)? Isso substituirá os louvores atuais deste aparelho.')){ev.target.value='';return;}songs=incoming;persist();localStorage.setItem('alteracoesDesdeBackup','0');letter='';$('q').value='';render();alert(songs.length+' louvor(es) restaurado(s) com sucesso.')}catch(e){alert('Não foi possível restaurar este arquivo. Escolha um backup válido do aplicativo Louvores.')}ev.target.value=''};reader.readAsText(file)}
function editCurrent(){editSong(current)}init();
</script></body></html>
